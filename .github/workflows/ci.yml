name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# CI must not require funded wallets, mainnet keys, or live RPC calls.
# All tests run against local EVM (Foundry) or mocked onchain reads.

jobs:
  contracts:
    name: Contract build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - name: Install dependencies (remappings need node_modules)
        run: bun install --frozen-lockfile

      - name: Build contracts
        run: forge build

      - name: Test contracts
        run: forge test -v
        # Expected: 120 tests (V1 unit + V2 unit + V2 invariant + C=E guard), 0 failures

  provider:
    name: Provider API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - name: Install provider dependencies
        run: cd provider && bun install --frozen-lockfile

      - name: Run provider tests
        run: cd provider && bun test
        # Expected: 108 tests (V1 + V2), 0 failures
        # No env vars required — tests use mocked onchain reads

  agent:
    name: Agent CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - name: Install agent dependencies
        run: cd agent && bun install --frozen-lockfile

      - name: Run agent tests
        run: cd agent && bun test src/test/
        # Expected: 15 tests, 0 failures
        # No env vars required — tests use mock signatures

  sdk:
    name: SDK typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - name: Install root dependencies (viem peer dep)
        run: bun install --frozen-lockfile

      - name: SDK typecheck
        run: cd packages/sdk && bun run typecheck

      - name: SDK tests
        run: cd packages/sdk && bun test src/
        # Expected: 66 tests (V1 + V2), 0 failures

  frontend:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + typecheck
        run: bun run check
        # Expected: 0 errors, 0 warnings

  example-app:
    name: Example agent app typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - name: Install root dependencies (workspace SDK)
        run: bun install --frozen-lockfile

      - name: Build SDK dist (example app depends on it)
        run: cd packages/sdk && bun run build

      - name: Install example app dependencies
        run: cd examples/agent-app && bun install --frozen-lockfile

      - name: Typecheck example app
        run: cd examples/agent-app && bunx tsc --noEmit
        # Verifies the example app typechecks against the published SDK surface

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bunx vite build
        # Verifies the frontend compiles without errors
        # VITE_* env vars default to placeholders; no live connection required
